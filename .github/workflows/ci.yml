name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  # Invariant 1 of 2. Static: the client may produce an allow-shaped value in exactly one place,
  # the response parser. Catches a fabricated allow -- a permissive literal, including a dataclass
  # or parameter default. It structurally cannot see a call that never asked, which is why the
  # second job exists.
  no-fail-open:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/no-fail-open.mjs

  # Invariant 2 of 2. Behavioural: every public call either makes exactly one request or raises,
  # and the decision returned was built from the body served for THAT request, proven by a
  # per-response nonce. Catches the two things the static check cannot -- a call that never asked
  # (a rollout that skips traffic) and a reused answer (a verdict cache).
  every-call-asks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test test/every-call-asks.test.js

  # Runs against a real deployment. Expected to be red until the two secrets exist and the
  # deployment is reachable; that is the point. A missing secret fails the job rather than skipping
  # it, so a green build can never mean "we never checked".
  contract:
    runs-on: ubuntu-latest
    needs: [build, no-fail-open, every-call-asks]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      BLINDAI_BASE_URL: ${{ secrets.BLINDAI_CONTRACT_BASE_URL }}
      BLINDAI_API_KEY: ${{ secrets.BLINDAI_CONTRACT_API_KEY }}
    steps:
      # Optional until switch-on (Elisha's ruling, 2026-10-06, option b): with no key, or a value
      # that is not a BlindAI API key (ba_...), the job says so and skips, instead of failing every
      # PR on a secret nobody can fix before switch-on. At switch-on a proper key and
      # BLINDAI_RUNTIME_SECRET are set and this job is required again. The value is never printed.
      - id: key
        run: |
          if [ -n "$BLINDAI_BASE_URL" ] && [ "${BLINDAI_API_KEY#ba_}" != "$BLINDAI_API_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=contract tests skipped::BLINDAI_CONTRACT_API_KEY is absent or not a ba_ API key (optional until switch-on, 2026-10-06)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.key.outputs.ready == 'true'
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
        if: steps.key.outputs.ready == 'true'
      - run: npm run test:contract
        if: steps.key.outputs.ready == 'true'
